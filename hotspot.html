<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso WiFi</title>
  <style>
    :root {
      --bg-start: #0f172a;
      --bg-end: #1e293b;
      --card: rgba(15, 23, 42, 0.78);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --border: rgba(148, 163, 184, 0.24);
      --error-bg: rgba(239, 68, 68, 0.16);
      --error-text: #fecaca;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #334155 0%, transparent 50%),
        linear-gradient(130deg, var(--bg-start), var(--bg-end));
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .card {
      width: min(100%, 400px);
      padding: 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 45px rgba(2, 6, 23, 0.45);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      font-weight: 700;
      color: #06293a;
    }

    .title {
      margin: 0;
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .subtitle {
      margin: 0.3rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .error {
      margin-bottom: 1rem;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: var(--error-bg);
      color: var(--error-text);
      border-radius: 12px;
      padding: 0.75rem 0.9rem;
      font-size: 0.88rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .field {
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.64);
      color: var(--text);
      border-radius: 12px;
      padding: 0.8rem 0.9rem;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      color: #022235;
      font-weight: 700;
      font-size: 0.98rem;
      padding: 0.85rem 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
    }

    button:hover {
      filter: brightness(1.06);
    }

    button:active {
      transform: translateY(1px);
    }

    .footnote {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="brand">
      <div class="brand-badge">Wi</div>
      <div>
        <h1 class="title">Conexión WiFi</h1>
        <p class="subtitle">Ingresa tus credenciales para navegar.</p>
      </div>
    </section>

    $(if error)
    <div class="error">$(error)</div>
    $(endif)

    <form action="$(link-login-only)" method="post">
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />

      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="usuario" value="$(username)" required />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
      </div>

      <button type="submit">Conectar</button>
    </form>

    <p class="footnote">Al continuar aceptas las políticas de uso de la red.</p>
  </main>
</body>
</html>
